services:

  postgres:
    image: postgres:17
    container_name: postgres-db

    environment:
      POSTGRES_DB: bankdb
      POSTGRES_USER: bankuser
      POSTGRES_PASSWORD: bankpass

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  banking-app:
    build: .

    container_name: banking-app

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker

    depends_on:
      - postgres

volumes:
  postgres-data: